name: CI

on:
  push:
    branches:
      - 'release/**'
  pull_request:
    branches: [ main ]

jobs:
  # PR check: Android/JVM + common tests only, on ubuntu-latest (no Apple-target minute multiplier).
  # Kotlin/Native can't cross-compile iOS targets outside a macOS host, so this job never touches them.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Android build and test
        run: ./gradlew :androidApp:assembleDebug :shared:testAndroidHostTest
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  # Full build (all KMP targets, including iOS) — only on a push to a release/* branch.
  # stockapp-app doesn't publish to GitHub Packages (it's the composer app, not a lib),
  # so there's no tag trigger here — APK/AAB/TestFlight artifact steps are a later
  # roadmap phase (Fase 12, polish and publication), not part of this change.
  release:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build -PfullIosMatrix=true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
