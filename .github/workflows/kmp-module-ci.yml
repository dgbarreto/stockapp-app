name: KMP Module CI

on:
  workflow_call:
    inputs:
      module:
        description: 'Gradle module name (e.g. quotes, auth, designsystem)'
        type: string
        required: true
      use-konan-cache:
        description: 'Cache the Kotlin/Native toolchain (~/.konan) in the release job'
        type: boolean
        required: false
        default: false
    secrets:
      GH_PACKAGES_TOKEN:
        required: true
      SONAR_TOKEN:
        required: true

jobs:
  # PR check + post-merge SonarQube analysis: Android/JVM + common tests only, on
  # ubuntu-latest (no Apple-target minute multiplier). Runs on PRs (build/test signal)
  # and on push to main (so SonarCloud gets a real main-branch analysis, not just PR
  # analyses that vanish once the PR branch is deleted).
  # Kotlin/Native can't cross-compile iOS targets outside a macOS host, so this job never touches them.
  build:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Android build and test
        run: ./gradlew :${{ inputs.module }}:testAndroidHostTest
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: SonarQube Cloud Scan
        run: ./gradlew sonar
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Full build (all KMP targets, including iOS) — only when generating a release:
  # a version tag (publishes to GitHub Packages) or a push to a release/* branch.
  # Excludes push to main (that's the lightweight build job above) so a routine
  # merge never triggers the costly macOS/full-iOS-matrix job.
  release:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: macos-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Cache Kotlin/Native toolchain
        if: inputs.use-konan-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Build and test
        run: ./gradlew build -PfullIosMatrix=true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew :${{ inputs.module }}:publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
